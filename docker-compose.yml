services:
  mysql-server:
    image: mysql:latest
    container_name: mysql-server
    pull_policy: if_not_present
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - spharos

  eureka:
    image: eureka
    container_name: eureka
    pull_policy: if_not_present
    ports:
      - "8761:8761"
    networks:
      - spharos

  gateway:
    image: gateway
    container_name: gateway
    pull_policy: if_not_present
    ports:
      - "8000:8000"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      - eureka
    networks:
      - spharos

  member-service:
    image: member-service
    container_name: member-service
    pull_policy: if_not_present
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      - eureka
      - mysql-server
    networks:
      - spharos

networks:
  spharos:
    name: spharos
    external: true

volumes:
  mysql-data:
