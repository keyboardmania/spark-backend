name: Java CI/CD with Gradle & Eureka

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./eureka

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: ./eureka

      - name: Docker build & docker hub push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}" .
          docker push "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
        working-directory: ./eureka

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_EC2 }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo docker pull "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
            sudo docker stop eureka || true
            sudo docker rm eureka || true
            sudo docker run -d \
              --name eureka \
              --network spharos \
              -p 8761:8761 \
              "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
            sudo docker image prune -a -f
